<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – Loovy Sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r9:#2a1259;--r7:#5b2bd1;--r5:#8b5cf6;--l1:#efe9ff;--l0:#f8f5ff;--tx:#1f1633;--ts:#5d5373;--rosa:#ff7ac6;--ok:#1f9d6b;--erro:#d6336c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--l0);color:var(--tx);line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--r5);outline-offset:2px}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;font:600 .9rem Sora,sans-serif;border:0;cursor:pointer;background:linear-gradient(135deg,var(--r7),var(--r5));color:#fff}
.btn.suave{background:var(--l1);color:var(--r7)}
.btn.perigo{background:#fde7ef;color:var(--erro)}
.btn.peq{padding:7px 14px;font-size:.8rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=date]{width:100%;padding:12px 16px;border-radius:999px;border:2px solid var(--l1);background:#fff;font:inherit}
input:focus{border-color:var(--r5);outline:none}
.msg{margin-top:14px;font-size:.85rem;color:var(--erro);min-height:1.2em}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .lado{background:linear-gradient(160deg,var(--r9),var(--r7) 65%,var(--r5));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .lado h1{font-size:2rem;line-height:1.15;max-width:14ch;letter-spacing:-.02em}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.logo span{color:var(--rosa)}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px}
.login form{width:100%;max-width:380px}
.login h2{font-size:1.5rem;color:var(--r9)}
.demo{margin-top:24px;background:var(--l1);border-radius:20px;padding:14px 18px;font-size:.8rem;color:var(--ts)}
.demo b{color:var(--r7)}

/* app */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--r9);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:6px}
.side .logo{padding:0 10px 18px}
.side a,.side button.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:#d9ccff;padding:11px 14px;border-radius:999px;font:500 .9rem Sora,sans-serif;cursor:pointer}
.side .on{background:rgba(255,255,255,.16);color:#fff}
.side .trava{opacity:.45;cursor:not-allowed}
.side .sair{margin-top:auto}
.main{padding:32px 36px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.topo h1{font-size:1.5rem;color:var(--r9)}
.card{background:#fff;border-radius:28px;padding:26px;margin-bottom:20px}
.card h2{font-size:1.05rem;color:var(--r7);margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:24px;padding:20px}
.stat small{color:var(--ts)}
.stat b{display:block;font-size:1.7rem;color:var(--r7)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--l1);vertical-align:middle}
th{color:var(--ts);font-weight:600}
.tabela{overflow-x:auto}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.75rem;font-weight:600}
.tag.ok{background:#dcf5ea;color:var(--ok)}
.tag.no{background:#fde7ef;color:var(--erro)}
.mods{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.mods label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.bloqueio{max-width:520px;margin:12vh auto;text-align:center}
.bloqueio h1{color:var(--erro);margin-bottom:10px}

@media(max-width:820px){
  .login{grid-template-columns:1fr}
  .login .lado{padding:28px;gap:24px}
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;padding:14px}
  .side .logo{padding:0 10px 0 0}
  .side .sair{margin-top:0}
  .main{padding:22px 16px}
  .grade{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="raiz"></div>

<script>
const MODULOS=["Loovy Live","Loovy Lojas","Loovy CRM","Loovy Frotas","Loovy Cinemas"];
const ADMIN={email:"admin@loovy.com",senha:"admin123",nome:"Administração Loovy"};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoje=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split("-").reverse().join("/"):"-";

function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ler(k,pad){try{const v=localStorage.getItem(k);return v?JSON.parse(v):pad}catch(e){return pad}}
function sessaoGet(){try{return JSON.parse(sessionStorage.getItem("loovy_sessao"))}catch(e){return null}}
function sessaoSet(v){try{v?sessionStorage.setItem("loovy_sessao",JSON.stringify(v)):sessionStorage.removeItem("loovy_sessao")}catch(e){}}

const SEED=[
 {id:1,nome:"Dama Fitness",email:"dama@cliente.com",senha:"1234",venc:"2026-12-10",bloqueado:false,modulos:["Loovy Live","Loovy Lojas"]},
 {id:2,nome:"Cinema Central",email:"cinema@cliente.com",senha:"1234",venc:"2026-10-01",bloqueado:false,modulos:["Loovy Cinemas"]}
];
let clientes=ler("loovy_clientes",SEED);
const salvar=()=>guardar("loovy_clientes",clientes);
const vencido=c=>c.venc&&c.venc<hoje();
const ativo=c=>!c.bloqueado&&!vencido(c);

function rota(){
  const s=sessaoGet(),h=location.hash||"#/login";
  if(!s){return telaLogin()}
  if(s.tipo==="admin"){return h==="#/admin"?telaAdmin():(location.hash="#/admin",null)}
  return telaCliente(s,h);
}
window.addEventListener("hashchange",rota);

/* LOGIN */
function telaLogin(){
  document.title="Entrar – Loovy Sistemas";
  $("#raiz").innerHTML=`
  <div class="login">
    <div class="lado">
      <a href="index.html" class="logo">Loovy<span>.</span></a>
      <h1>Acesse o painel do seu negócio.</h1>
      <small>Cada empresa tem seu próprio painel e seus próprios usuários.</small>
    </div>
    <div class="form">
      <form id="f" novalidate>
        <h2>Entrar</h2>
        <label for="e">E-mail</label><input id="e" type="email" autocomplete="username">
        <label for="s">Senha</label><input id="s" type="password" autocomplete="current-password">
        <p class="msg" id="m" role="alert"></p>
        <button class="btn" style="width:100%;margin-top:6px">Entrar</button>
        <div class="demo">Acessos de teste:<br><b>Admin:</b> admin@loovy.com / admin123<br><b>Cliente:</b> dama@cliente.com / 1234<br><b>Cliente vencido:</b> cinema@cliente.com / 1234</div>
      </form>
    </div>
  </div>`;
  $("#f").onsubmit=ev=>{
    ev.preventDefault();
    const e=$("#e").value.trim().toLowerCase(),s=$("#s").value;
    if(e===ADMIN.email&&s===ADMIN.senha){sessaoSet({tipo:"admin"});location.hash="#/admin";return rota()}
    const c=clientes.find(x=>x.email.toLowerCase()===e&&x.senha===s);
    if(c){sessaoSet({tipo:"cliente",id:c.id});location.hash="#/painel";return rota()}
    $("#m").textContent="E-mail ou senha incorretos. Confira os dados e tente de novo.";
  };
}

/* CLIENTE */
function telaCliente(s,h){
  const c=clientes.find(x=>x.id===s.id);
  if(!c){sessaoSet(null);return telaLogin()}
  document.title=c.nome+" – Loovy";
  if(!ativo(c)){
    const motivo=c.bloqueado?"O acesso foi bloqueado pela administração.":"O plano venceu em "+fmt(c.venc)+".";
    $("#raiz").innerHTML=`<div class="bloqueio card"><h1>Acesso bloqueado</h1><p>${motivo} Entre em contato com a Loovy para regularizar e liberar o painel.</p><br><button class="btn" id="sair">Sair</button></div>`;
    $("#sair").onclick=sair;return;
  }
  const atual=decodeURIComponent((h.split("/")[2]||""));
  const lista=MODULOS.map(m=>{
    const tem=c.modulos.includes(m);
    return tem?`<a href="#/painel/${encodeURIComponent(m)}" class="${atual===m?"on":""}">${m}</a>`:`<button class="item trava" disabled title="Módulo não contratado">${m}<span>🔒</span></button>`;
  }).join("");
  const conteudo=atual&&c.modulos.includes(atual)
    ?`<div class="card"><h2>${esc(atual)}</h2><p>Este módulo está liberado para ${esc(c.nome)}. A tela dele será construída na próxima etapa.</p></div>`
    :`<div class="stats">
        <div class="stat"><small>Módulos ativos</small><b>${c.modulos.length}</b></div>
        <div class="stat"><small>Plano válido até</small><b>${fmt(c.venc)}</b></div>
        <div class="stat"><small>Situação</small><b style="color:var(--ok)">Ativo</b></div>
      </div>
      <div class="card"><h2>Bem-vindo ao seu painel</h2><p>Use o menu ao lado para abrir seus módulos. Os que aparecem com cadeado não fazem parte do seu plano.</p></div>`;
  $("#raiz").innerHTML=`
  <div class="app">
    <aside class="side">
      <a href="#/painel" class="logo">Loovy<span>.</span></a>
      <a href="#/painel" class="${atual?"":"on"}">Início</a>${lista}
      <button class="item sair" id="sair">Sair</button>
    </aside>
    <main class="main"><div class="topo"><h1>${esc(c.nome)}</h1></div>${conteudo}</main>
  </div>`;
  $("#sair").onclick=sair;
}

/* ADMIN */
let editando=null;
function telaAdmin(){
  document.title="Administração – Loovy";
  const ed=clientes.find(x=>x.id===editando)||{nome:"",email:"",senha:"",venc:"",modulos:[]};
  const linhas=clientes.map(c=>`
    <tr>
      <td><b>${esc(c.nome)}</b><br><small>${esc(c.email)}</small></td>
      <td>${c.modulos.length?c.modulos.map(esc).join(", "):"-"}</td>
      <td>${fmt(c.venc)}</td>
      <td><span class="tag ${ativo(c)?"ok":"no"}">${c.bloqueado?"Bloqueado":vencido(c)?"Vencido":"Ativo"}</span></td>
      <td class="acoes">
        <button class="btn peq suave" data-a="edit" data-id="${c.id}">Editar</button>
        <button class="btn peq suave" data-a="bloq" data-id="${c.id}">${c.bloqueado?"Liberar":"Bloquear"}</button>
        <button class="btn peq perigo" data-a="del" data-id="${c.id}">Excluir</button>
      </td>
    </tr>`).join("");
  const ativos=clientes.filter(ativo).length;
  $("#raiz").innerHTML=`
  <div class="app">
    <aside class="side">
      <a href="#/admin" class="logo">Loovy<span>.</span></a>
      <a href="#/admin" class="on">Clientes</a>
      <button class="item sair" id="sair">Sair</button>
    </aside>
    <main class="main">
      <div class="topo"><h1>Administração geral</h1></div>
      <div class="stats">
        <div class="stat"><small>Clientes</small><b>${clientes.length}</b></div>
        <div class="stat"><small>Ativos</small><b style="color:var(--ok)">${ativos}</b></div>
        <div class="stat"><small>Bloqueados ou vencidos</small><b style="color:var(--erro)">${clientes.length-ativos}</b></div>
      </div>
      <div class="card"><h2>${editando?"Editar cliente":"Novo cliente"}</h2>
        <form id="fc" novalidate>
          <div class="grade">
            <div><label for="n">Nome da empresa</label><input id="n" type="text" value="${esc(ed.nome)}"></div>
            <div><label for="ce">E-mail de acesso</label><input id="ce" type="email" value="${esc(ed.email)}"></div>
            <div><label for="cs">Senha de acesso</label><input id="cs" type="text" value="${esc(ed.senha)}"></div>
            <div><label for="v">Vencimento do plano</label><input id="v" type="date" value="${esc(ed.venc)}"></div>
          </div>
          <label>Módulos liberados</label>
          <div class="mods">${MODULOS.map(m=>`<label><input type="checkbox" value="${m}" ${ed.modulos.includes(m)?"checked":""}>${m}</label>`).join("")}</div>
          <p class="msg" id="m" role="alert"></p>
          <div class="acoes"><button class="btn">${editando?"Salvar alterações":"Cadastrar cliente"}</button>${editando?'<button type="button" class="btn suave" id="cancel">Cancelar</button>':""}</div>
        </form>
      </div>
      <div class="card"><h2>Clientes</h2><div class="tabela"><table>
        <thead><tr><th>Cliente</th><th>Módulos</th><th>Vencimento</th><th>Situação</th><th>Ações</th></tr></thead>
        <tbody>${linhas||'<tr><td colspan="5">Nenhum cliente cadastrado. Use o formulário acima para criar o primeiro.</td></tr>'}</tbody>
      </table></div></div>
    </main>
  </div>`;
  $("#sair").onclick=sair;
  if(editando)$("#cancel").onclick=()=>{editando=null;telaAdmin()};
  $("#fc").onsubmit=ev=>{
    ev.preventDefault();
    const d={nome:$("#n").value.trim(),email:$("#ce").value.trim(),senha:$("#cs").value.trim(),venc:$("#v").value,
      modulos:[...document.querySelectorAll(".mods input:checked")].map(i=>i.value)};
    if(!d.nome||!d.email||!d.senha||!d.venc){$("#m").textContent="Preencha nome, e-mail, senha e vencimento.";return}
    if(clientes.some(x=>x.email.toLowerCase()===d.email.toLowerCase()&&x.id!==editando)||d.email.toLowerCase()===ADMIN.email){$("#m").textContent="Já existe um acesso com esse e-mail.";return}
    if(editando){Object.assign(clientes.find(x=>x.id===editando),d)}
    else{clientes.push({id:Date.now(),bloqueado:false,...d})}
    editando=null;salvar();telaAdmin();
  };
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const id=Number(b.dataset.id),c=clientes.find(x=>x.id===id),a=b.dataset.a;
    if(a==="edit"){editando=id;telaAdmin();scrollTo(0,0)}
    if(a==="bloq"){c.bloqueado=!c.bloqueado;salvar();telaAdmin()}
    if(a==="del"&&confirm("Excluir "+c.nome+"? Essa ação não pode ser desfeita.")){clientes=clientes.filter(x=>x.id!==id);salvar();telaAdmin()}
  });
}

function sair(){sessaoSet(null);editando=null;location.hash="#/login";rota()}
rota();
</script>
</body>
</html>
